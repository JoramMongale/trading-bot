[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-bot"
version = "0.1.0"
description = "Gold 5m breakout bot — high-probability resistance breakout setup on XAUUSD 5-minute candles"
requires-python = ">=3.11"
dependencies = [
    "pandas>=3.0",
    "numpy>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9",
]
analytics = [
    "duckdb>=1.2",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["trading_bot*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
