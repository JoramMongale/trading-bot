<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trading Bot Dashboard</title>
<style>
:root {
  --bg: #f4f5f7; --card: #ffffff; --ink: #1c2330; --muted: #6b7280;
  --line: #e2e6ec; --ok: #1a7f37; --okbg: #e6f4ea; --warn: #9a6700;
  --warnbg: #fff4d6; --fail: #c62828; --failbg: #fdecea; --accent: #2457a6;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 14px/1.45 -apple-system, "Segoe UI", Roboto, sans-serif; }
header { display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  padding: 10px 18px; background: var(--card); border-bottom: 1px solid var(--line); }
h1 { font-size: 17px; margin: 0; }
.sub { color: var(--muted); font-weight: 400; }
.controls { margin-left: auto; display: flex; align-items: center; gap: 12px; }
.updated { color: var(--muted); font-size: 12px; }
.err { color: var(--fail); font-size: 12px; }
.tabs { display: flex; gap: 4px; padding: 10px 18px 0; }
.tab { border: 1px solid var(--line); border-bottom: 0; background: #e9edf3;
  padding: 6px 18px; cursor: pointer; font-size: 13px; border-radius: 6px 6px 0 0; }
.tab.active { background: var(--card); font-weight: 600; color: var(--accent); }
main { padding: 12px 18px 40px; max-width: 1080px; }
.panel { display: none; }
.panel.active { display: block; }
.card { background: var(--card); border: 1px solid var(--line);
  border-radius: 8px; padding: 12px 14px; margin: 10px 0; }
.card h3 { margin: 0 0 8px; font-size: 14px; }
.card h4 { margin: 10px 0 4px; font-size: 12px; text-transform: uppercase;
  color: var(--muted); letter-spacing: .04em; }
.muted { color: var(--muted); }
.badge { display: inline-block; padding: 1px 8px; border-radius: 10px;
  font-size: 11px; font-weight: 600; margin-right: 8px; }
.badge.ok { background: var(--okbg); color: var(--ok); }
.badge.warn { background: var(--warnbg); color: var(--warn); }
.badge.fail { background: var(--failbg); color: var(--fail); }
.banner { border-radius: 6px; padding: 8px 10px; margin: 8px 0; font-size: 13px;
  white-space: pre-wrap; }
.banner.ok { background: var(--okbg); color: var(--ok); }
.banner.warn { background: var(--warnbg); color: var(--warn); }
.banner.fail { background: var(--failbg); color: var(--fail); }
.kv { color: var(--muted); font-size: 12px; margin: 4px 0; }
.pos { color: var(--ok); } .neg { color: var(--fail); }
.changed { color: var(--accent); font-weight: 600; }
table.grid { border-collapse: collapse; width: 100%; font-size: 13px; }
table.grid th, table.grid td { border: 1px solid var(--line); padding: 3px 8px;
  text-align: left; }
table.grid th { background: #f0f2f6; font-weight: 600; }
.fields { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 8px; }
.field { display: flex; flex-direction: column; font-size: 12px; color: var(--muted); }
.field input { margin-top: 2px; padding: 4px 6px; border: 1px solid var(--line);
  border-radius: 4px; font: 13px ui-monospace, Menlo, monospace; }
.actions { display: flex; align-items: center; gap: 14px; margin: 10px 0; flex-wrap: wrap; }
.btn { background: var(--accent); color: #fff; border: 0; border-radius: 5px;
  padding: 6px 14px; cursor: pointer; font-size: 13px; }
.btn.apply { background: #b45309; }
.btn:disabled { background: #c9ced6; cursor: not-allowed; }
.toggle { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 4px; }
.preview { margin: 8px 0; }
.cli-out { background: #0f172a; color: #d7f0d7; padding: 10px; border-radius: 6px;
  font: 12px ui-monospace, Menlo, monospace; white-space: pre-wrap;
  overflow-x: auto; max-height: 320px; display: none; }
.cli-out.ok, .cli-out.fail { display: block; }
.cli-out.fail { color: #ffd7d7; }
.note { font-size: 13px; margin: 6px 0; color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>Gold 5m Breakout Bot <span class="sub">— local dashboard</span></h1>
  <div class="controls">
    <button id="btn-refresh" class="btn">Refresh</button>
    <label class="toggle"><input type="checkbox" id="chk-auto"> auto-refresh 15s</label>
    <span id="updated" class="updated"></span>
    <span id="err" class="err"></span>
  </div>
</header>
<nav class="tabs">
  <button class="tab active" data-tab="status">Status</button>
  <button class="tab" data-tab="risk">Risk</button>
  <button class="tab" data-tab="account">Account</button>
</nav>
<main>
  <section id="panel-status" class="panel active"><div id="status-content"></div></section>
  <section id="panel-risk" class="panel"><div id="risk-content"></div></section>
  <section id="panel-account" class="panel"><div id="account-content"></div></section>
</main>
<script>
"use strict";
const $ = id => document.getElementById(id);
let STATUS = null, RISK = null;
const PREVIEW = {}; // tag -> last successful preview {ok, set, ...}

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g,
    c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function fmt(n) { // minimal float, like the CLI
  if (n == null || isNaN(n)) return "—";
  return String(Math.round(n * 100) / 100);
}
function f2(n) { // fixed 2 dp, like the CLI's pct/R prints
  if (n == null || isNaN(n)) return "—";
  return n.toFixed(2);
}
function dur(secs) {
  const h = Math.floor(secs / 3600), m = Math.floor((secs % 3600) / 60);
  return h + ":" + String(m).padStart(2, "0");
}
function badge(level) {
  const cls = level === "ok" ? "ok" : (level === "WARN" ? "warn" : "fail");
  return '<span class="badge ' + cls + '">' + esc(level) + "</span>";
}

/* ---------- tabs ---------- */
document.querySelectorAll(".tab").forEach(btn => btn.addEventListener("click", () => {
  document.querySelectorAll(".tab").forEach(b => b.classList.toggle("active", b === btn));
  document.querySelectorAll(".panel").forEach(p =>
    p.classList.toggle("active", p.id === "panel-" + btn.dataset.tab));
}));

/* ---------- load ---------- */
async function loadAll() {
  try {
    const [s, r] = await Promise.all([
      fetch("/api/status").then(x => x.json()),
      fetch("/api/risk").then(x => x.json()),
    ]);
    STATUS = s; RISK = r;
    renderStatus(); renderRisk(); renderAccount();
    $("updated").textContent = "updated " + new Date().toLocaleTimeString();
    $("err").textContent = "";
  } catch (e) {
    $("err").textContent = "load failed: " + e;
  }
}
$("btn-refresh").addEventListener("click", loadAll);
let autoTimer = null;
$("chk-auto").addEventListener("change", () => {
  if (autoTimer) { clearInterval(autoTimer); autoTimer = null; }
  if ($("chk-auto").checked) autoTimer = setInterval(loadAll, 15000);
});

/* ---------- Status tab ---------- */
function renderStatus() {
  const tags = (STATUS && STATUS.tags) || {};
  const html = Object.entries(tags).map(([tag, t]) => {
    const b = t.bot || {};
    const lines = [
      "supervisor pid " + esc(b.supervisor_pid == null ? "—" : b.supervisor_pid)
        + (b.supervisor_alive ? "" : " <b>(gone)</b>"),
      "bot pid " + esc(b.bot_pid == null ? "—" : b.bot_pid)
        + (b.bot_alive ? "" : " <b>(gone)</b>"),
      "last decision " + (b.last_decision_min_ago == null
        ? "no timestamped lines yet" : esc(b.last_decision_min_ago) + " min ago"),
    ].map(x => '<div class="kv">' + x + "</div>").join("");
    let brokerHtml = "";
    if (t.broker && t.broker.error) {
      brokerHtml = '<div class="banner fail">broker unreachable: ' + esc(t.broker.error) + "</div>";
    } else if (t.broker) {
      brokerHtml = '<div class="kv">terminal connected: <b>'
        + (t.broker.connected ? "yes" : "NO") + "</b> · algorithmic trading: <b>"
        + (t.broker.trade_allowed ? "allowed" : "DISALLOWED — orders will be rejected")
        + "</b></div>";
    }
    let posHtml = '<div class="muted">no open position</div>';
    if (t.position) {
      const p = t.position;
      const fp = (p.floating >= 0 ? "+" : "") + f2(p.floating);
      const fpct = (p.floating_pct >= 0 ? "+" : "") + f2(p.floating_pct);
      const rr = p.current_r == null ? "—" : (p.current_r >= 0 ? "+" : "") + f2(p.current_r) + "R";
      posHtml = '<table class="grid">'
        + "<tr><td>entry</td><td>" + esc(p.entry) + "</td><td>SL</td><td>" + esc(p.sl)
        + "</td><td>TP</td><td>" + esc(p.tp) + "</td></tr>"
        + "<tr><td>bid</td><td>" + esc(p.bid == null ? "—" : p.bid)
        + "</td><td>ask</td><td>" + esc(p.ask == null ? "—" : p.ask)
        + '</td><td>floating</td><td class="' + (p.floating >= 0 ? "pos" : "neg") + '">'
        + fp + " USC (" + fpct + "%)</td></tr>"
        + "<tr><td>current R</td><td class=\"" + (p.current_r >= 0 ? "pos" : "neg")
        + '">' + rr + "</td><td>SL dist</td><td>" + f2(p.sl_pct) + "%</td><td>TP dist</td><td>"
        + f2(p.tp_pct) + "%</td></tr>"
        + "<tr><td>open</td><td colspan=\"5\">" + dur(p.open_secs) + " · " + esc(p.side) + " "
        + esc(p.volume) + " " + esc(p.symbol) + " · ticket " + esc(p.ticket) + "</td></tr>"
        + "</table>";
    }
    return '<div class="card"><h3>' + esc(tag)
      + ' <span class="muted">' + esc(t.symbol) + " · magic " + esc(t.magic) + "</span></h3>"
      + badge(b.log_level || "ok") + lines + brokerHtml
      + "<h4>open position</h4>" + posHtml + "</div>";
  }).join("");
  $("status-content").innerHTML = html;
}

/* ---------- Account tab ---------- */
function renderAccount() {
  const tags = (STATUS && STATUS.tags) || {};
  let html = "";
  const seen = new Set();
  for (const t of Object.values(tags)) {
    const a = t.account;
    if (!a || seen.has(a.login)) continue;
    seen.add(a.login);
    html += '<div class="card"><h3>account</h3><table class="grid">'
      + "<tr><td>login</td><td>" + esc(a.login) + "</td><td>server</td><td>"
      + esc(a.server) + "</td><td>currency</td><td>" + esc(a.currency) + "</td></tr>"
      + "<tr><td>balance</td><td>" + f2(a.balance) + "</td><td>equity</td><td>"
      + f2(a.equity) + '</td><td>floating</td><td class="'
      + (a.floating >= 0 ? "pos" : "neg") + '">' + (a.floating >= 0 ? "+" : "")
      + f2(a.floating) + "</td></tr></table></div>";
  }
  for (const [tag, t] of Object.entries(tags)) {
    const c = t.closes || { rows: [], totals: { n: 0, profit_sum: 0, r_sum: 0, skipped: 0 } };
    html += '<div class="card"><h3>recent closes — ' + esc(tag) + " ("
      + esc(t.symbol) + ")</h3>";
    if (!c.rows.length) {
      html += '<div class="muted">no closes for ' + esc(t.symbol) + "</div>";
    } else {
      html += '<table class="grid"><tr><th>ts</th><th>how</th><th>profit</th><th>R</th></tr>'
        + c.rows.map(row => "<tr><td>" + esc(row.ts) + "</td><td>" + esc(row.how)
          + '</td><td class="' + (row.profit >= 0 ? "pos" : "neg") + '">'
          + (row.profit >= 0 ? "+" : "") + f2(row.profit) + "</td><td>" + esc(row.r)
          + "</td></tr>").join("")
        + "</table>";
    }
    const ttl = c.totals;
    html += '<div class="kv">' + ttl.n + " closed · profit "
      + (ttl.profit_sum >= 0 ? "+" : "") + f2(ttl.profit_sum) + " USC · sum R "
      + f2(ttl.r_sum)
      + (ttl.skipped ? " (" + ttl.skipped + " skipped, r=?)" : "")
      + "</div></div>";
  }
  $("account-content").innerHTML = html;
}

/* ---------- Risk tab ---------- */
function riskKeys(t) {
  const keys = Object.keys(t.risk || {});
  if (t.strategy_rr_multiple != null) keys.push("strategy.rr_multiple");
  return keys;
}
function riskCurrent(t, k) {
  return k === "strategy.rr_multiple" ? t.strategy_rr_multiple : (t.risk || {})[k];
}
function renderRisk() {
  const r = RISK || {};
  const tags = r.tags || {};
  const total = r.account_total, policy = r.standing_policy;
  const head = '<div class="note">account-wide risk if every stop hits: <b class="'
    + (total > policy ? "neg" : "") + '">' + fmt(total) + "%</b> (standing policy "
    + fmt(policy) + "%)</div>"
    + '<div class="note">Read-only unless you preview and then confirm. '
    + "Edits go through scripts/tune_risk.py unchanged — the same validation "
    + "and warnings as the CLI.</div>";
  const html = Object.entries(tags).map(([tag, t]) => {
    const inputs = riskKeys(t).map(k =>
      '<label class="field"><span>' + esc(k) + "</span><input id=\"in-" + esc(tag)
      + "-" + esc(k) + '" value="' + esc(riskCurrent(t, k)) + '" spellcheck="false"></label>'
    ).join("");
    return '<div class="card"><h3>' + esc(tag)
      + ' <span class="muted">' + esc(t.config) + " · magic " + esc(t.magic) + "</span></h3>"
      + '<div class="fields">' + inputs + "</div>"
      + '<div class="actions">'
      + '<button class="btn" onclick="preview(\'' + esc(tag) + '\')">Preview changes</button>'
      + '<label class="toggle"><input type="checkbox" id="restart-' + esc(tag)
      + '" checked> restart launchd agent to apply now (can take up to 5 min)</label>'
      + "</div>"
      + '<div id="preview-' + esc(tag) + '" class="preview"></div>'
      + '<button class="btn apply" id="apply-' + esc(tag) + '" disabled onclick="applyChange(\''
      + esc(tag) + '\')">Confirm &amp; Apply</button>'
      + '<pre id="out-' + esc(tag) + '" class="cli-out"></pre>'
      + "</div>";
  }).join("");
  $("risk-content").innerHTML = head + html;
}
function changedPairs(tag) {
  const t = RISK.tags[tag];
  const pairs = [];
  for (const k of riskKeys(t)) {
    const input = $("in-" + tag + "-" + k);
    if (!input) continue;
    if (input.value.trim() !== String(riskCurrent(t, k))) pairs.push(k + "=" + input.value.trim());
  }
  return pairs;
}
async function preview(tag) {
  const set = changedPairs(tag);
  const box = $("preview-" + tag);
  $("apply-" + tag).disabled = true;
  try {
    const res = await fetch("/api/risk/preview", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ tag, set }),
    });
    const d = await res.json();
    if (!d.ok) {
      box.innerHTML = '<div class="banner fail">'
        + (d.errors || []).map(esc).join("<br>") + "</div>";
      return;
    }
    if (d.no_change) {
      box.innerHTML = '<div class="banner ok">no change — nothing would be written</div>';
      return;
    }
    PREVIEW[tag] = Object.assign({}, d, { set });
    let h = '<div class="banner ' + (d.requires_yes ? "warn" : "ok")
      + '">account-wide total: <b>' + fmt(d.total_before) + "% → " + fmt(d.total_after)
      + "%</b>" + (d.requires_yes
        ? " — this change requires confirmation — confirm to apply" : "")
      + "</div>";
    h += '<table class="grid"><tr><th>key</th><th>old</th><th>new</th></tr>'
      + d.changes.map(c => "<tr><td>" + esc(c.dotted) + "</td><td>" + esc(c.old)
        + '</td><td class="' + (c.old === c.new ? "" : "changed") + '">' + esc(c.new)
        + "</td></tr>").join("")
      + "</table>";
    h += (d.warnings || []).map(w =>
      '<div class="banner warn">' + esc(w).replace(/\n/g, "<br>") + "</div>").join("");
    box.innerHTML = h;
    $("apply-" + tag).disabled = false;
  } catch (e) {
    box.innerHTML = '<div class="banner fail">preview failed: ' + esc(String(e)) + "</div>";
  }
}
async function applyChange(tag) {
  const d = PREVIEW[tag];
  const out = $("out-" + tag);
  if (!d || !d.ok || d.no_change) return;
  out.textContent = "";
  const restart = $("restart-" + tag).checked;
  try {
    const res = await fetch("/api/risk/apply", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ tag, set: d.set, restart }),
    });
    const r = await res.json();
    out.textContent = r.output || "";
    out.className = "cli-out " + (r.exit_code === 0 ? "ok" : "fail");
    $("apply-" + tag).disabled = true;
    loadAll(); // refresh numbers after a write
  } catch (e) {
    out.textContent = "apply failed: " + e;
  }
}

loadAll();
</script>
</body>
</html>
